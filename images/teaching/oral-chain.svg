<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">An example oral-practice chain</title><desc id="desc">First define density altitude, then explain performance effects, then identify the aircraft chart and inputs that would be needed. This is an illustrative study chain.</desc><rect width="800" height="440" fill="#14202b"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="18" fill="#b8c7d2">EXAMPLE STUDY CHAIN</text><g fill="#1d2e3b" stroke="#3a4d59"><rect x="35" y="75" width="730" height="85" rx="12"/><rect x="75" y="183" width="690" height="85" rx="12"/><rect x="115" y="291" width="650" height="85" rx="12"/></g><g font-size="17" fill="#e8a23a"><text x="59" y="104">DEFINE IT</text><text x="99" y="213">CONNECT IT</text><text x="139" y="321">SUPPORT IT</text></g><g font-size="25" fill="#f7f3ea"><text x="59" y="139">What is density altitude?</text><text x="99" y="248">How does it affect takeoff and climb?</text><text x="139" y="356">Which chart and inputs would you use?</text></g><text x="35" y="415" font-size="18" fill="#b8c7d2">A definition → a consequence → the aircraft data.</text></g></svg>
