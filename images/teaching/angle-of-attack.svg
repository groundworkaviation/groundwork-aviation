<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Angle of attack</title><desc id="desc">The angle between the wing chord and the relative-wind direction. The airfoil's leading edge is on the right and the relative wind points left.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#347b74"/></marker></defs><rect width="800" height="440" fill="#eef4f1"/><text x="35" y="42" font-family="Arial,sans-serif" font-size="18" fill="#526760">WING CHORD + RELATIVE WIND</text><path d="M201 280C291 222 539 112 619 139C658 156 643 183 611 189C505 226 340 265 201 280Z" fill="#c2d8d1" stroke="#507b72" stroke-width="3"/><path d="M201 280 642 164" stroke="#ab6610" stroke-width="3" stroke-dasharray="8 6"/><path d="M730 280H110" stroke="#347b74" stroke-width="3" marker-end="url(#arrow)"/><path d="M306 280A105 105 0 0 0 302 252" stroke="#ab6610" stroke-width="4" fill="none"/><g font-family="Arial,sans-serif"><text x="350" y="315" font-size="25" fill="#347b74">Relative wind ←</text><text x="374" y="147" font-size="25" fill="#9b5b0b">Chord line</text><text x="95" y="350" font-size="23" fill="#9b5b0b">Angle of attack</text><text x="535" y="105" font-size="18" fill="#526760">Leading edge</text><text x="65" y="239" font-size="18" fill="#526760">Trailing edge</text><text x="35" y="406" font-size="20" fill="#526760">A wing’s orientation to the airflow, rather than to the horizon.</text></g><path d="M603 112 642 164M151 244 201 280M263 330 302 267" fill="none" stroke="#7c938e"/></svg>
