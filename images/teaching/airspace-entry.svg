<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">VFR communication requirements before entry</title><desc id="desc">Class B requires an ATC clearance. Class C and D require established two-way radio communication before entry. Other entry requirements also apply.</desc><rect width="800" height="440" fill="#14202b"/><g font-family="Arial,sans-serif"><text x="36" y="43" fill="#b8c7d2" font-size="18">BEFORE VFR ENTRY · COMMUNICATION REQUIREMENT</text><g fill="#1d2e3b" stroke="#3a4d59"><rect x="30" y="75" width="235" height="285" rx="16"/><rect x="283" y="75" width="235" height="285" rx="16"/><rect x="536" y="75" width="235" height="285" rx="16"/></g><g fill="#e8a23a" font-size="58" text-anchor="middle"><text x="147" y="160">B</text><text x="400" y="160">C</text><text x="653" y="160">D</text></g><g fill="#f7f3ea" font-size="25" text-anchor="middle"><text x="147" y="226">ATC</text><text x="147" y="260">clearance</text><text x="400" y="226">Two-way radio</text><text x="400" y="260">communication</text><text x="653" y="226">Two-way radio</text><text x="653" y="260">communication</text></g><g stroke="#6fc3ae" stroke-width="4" fill="none"><path d="m135 303 9 9 18-21m226 12 9 9 18-21m226 12 9 9 18-21"/></g><text x="36" y="407" fill="#b8c7d2" font-size="20">Also check pilot, equipment, weather, and ATC instructions.</text></g></svg>
