<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Three directions of cloud clearance</title><desc id="desc">For Class C and D, and Class E below 10,000 feet MSL: 1,000 feet above, 500 feet below, 2,000 feet horizontally. Flight visibility is 3 statute miles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#347b74"/></marker></defs><rect width="800" height="440" fill="#eef4f1"/><g stroke="#dce6e2" stroke-width="1"><path d="M0 100H800M0 200H800M0 300H800M100 0V440M200 0V440M300 0V440M400 0V440M500 0V440M600 0V440M700 0V440"/></g><text x="35" y="39" font-family="Arial,sans-serif" font-size="18" fill="#526760">CLASS C / D · CLASS E BELOW 10,000 FT MSL</text><path d="M290 270C245 270 244 207 283 201C278 154 334 137 358 164C390 118 458 135 464 184C519 175 550 238 510 263C503 270 490 270 475 270Z" fill="#fff" stroke="#9fbdb5" stroke-width="3"/><g fill="#142e37"><path d="M374 63h42l-15-9h-8zM389 50h8v33h-8z"/><path d="M374 361h42l-15-9h-8zM389 348h8v33h-8z"/><path d="M703 225h42l-15-9h-8zM718 212h8v33h-8z"/></g><g fill="none" stroke="#347b74" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M394 92V130"/><path d="M394 283V335"/><path d="M550 229H684"/></g><g font-family="Arial,sans-serif" font-weight="bold" font-size="25" fill="#183b38"><text x="430" y="105">1,000 ft above</text><text x="430" y="320">500 ft below</text><text x="560" y="183">2,000 ft</text></g><text x="555" y="204" font-family="Arial,sans-serif" font-size="18" fill="#526760">horizontal</text><text x="36" y="409" font-family="Arial,sans-serif" font-size="21" fill="#183b38">3 SM flight visibility is a separate requirement.</text></svg>
