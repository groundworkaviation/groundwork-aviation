<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Air density in equal volumes</title><desc id="desc">Two equal-sized boxes. The denser-air box contains more representative dots; the less-dense-air box contains fewer. Counts are schematic.</desc><rect width="800" height="440" fill="#14202b"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="18" fill="#b8c7d2">SAME VOLUME · DIFFERENT AIR DENSITY</text><text x="65" y="96" font-size="27" fill="#f7f3ea">Denser air</text><text x="437" y="96" font-size="27" fill="#f7f3ea">Less dense air</text><g stroke="#526674" fill="#1b2b36"><rect x="55" y="125" width="310" height="205" rx="12"/><rect x="435" y="125" width="310" height="205" rx="12"/></g><g fill="#71baad"><circle cx="90" cy="160" r="7"/><circle cx="150" cy="165" r="7"/><circle cx="213" cy="160" r="7"/><circle cx="270" cy="169" r="7"/><circle cx="333" cy="160" r="7"/><circle cx="110" cy="215" r="7"/><circle cx="175" cy="210" r="7"/><circle cx="240" cy="220" r="7"/><circle cx="310" cy="210" r="7"/><circle cx="90" cy="274" r="7"/><circle cx="150" cy="275" r="7"/><circle cx="215" cy="282" r="7"/><circle cx="275" cy="272" r="7"/><circle cx="333" cy="282" r="7"/></g><g fill="#e8a23a"><circle cx="480" cy="166" r="7"/><circle cx="610" cy="161" r="7"/><circle cx="705" cy="200" r="7"/><circle cx="535" cy="235" r="7"/><circle cx="640" cy="279" r="7"/><circle cx="481" cy="290" r="7"/></g><text x="55" y="368" font-size="21" fill="#71baad">Lower density altitude</text><text x="435" y="368" font-size="21" fill="#e8a23a">Higher density altitude</text><text x="35" y="411" font-size="18" fill="#b8c7d2">Conceptual particle picture. Use POH/AFM charts for performance.</text></g></svg>
