<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The four forces in straight-and-level, unaccelerated flight</title><desc id="desc">Lift acts upward, weight downward, thrust forward, and drag backward. Lift balances weight and thrust balances drag in the illustrated flight condition.</desc><defs><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b97112"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#347b74"/></marker></defs><rect width="800" height="440" fill="#f3f5ef"/><g fill="none" stroke="#d6dfd7"><circle cx="400" cy="225" r="100"/><path d="M35 225H765M400 65V390" stroke-dasharray="5 7"/></g><path d="M277 229 285 202 300 202 314 222 415 220 440 207 456 218 486 224 502 232 481 238 307 238Z" fill="#314b58"/><path d="M385 221 349 202 364 202 421 224" fill="#728d96"/><path d="M343 238 381 257 395 257 383 238" fill="#728d96"/><g fill="none" stroke-width="5"><path d="M400 197V89" stroke="#347b74" marker-end="url(#green)"/><path d="M400 260V369" stroke="#347b74" marker-end="url(#green)"/><path d="M514 231H672" stroke="#b97112" marker-end="url(#amber)"/><path d="M264 231H106" stroke="#b97112" marker-end="url(#amber)"/></g><g font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#233d44"><text x="430" y="123">Lift</text><text x="430" y="352">Weight</text><text x="562" y="199">Thrust</text><text x="130" y="199">Drag</text></g><text x="35" y="38" font-family="Arial,sans-serif" font-size="18" fill="#53666a">STRAIGHT-AND-LEVEL · UNACCELERATED FLIGHT</text><text x="35" y="411" font-family="Arial,sans-serif" font-size="20" fill="#53666a">Lift = weight. Thrust = drag. This condition matters.</text></svg>
